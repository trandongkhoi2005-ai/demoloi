name: Build FF External IPA

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          XCODE_PATH=""
          for ver in Xcode_16.3 Xcode_16.2 Xcode_16.1 Xcode_16; do
            if [ -d "/Applications/${ver}.app" ]; then
              XCODE_PATH="/Applications/${ver}.app"
              break
            fi
          done
          if [ -z "$XCODE_PATH" ]; then
            XCODE_PATH=$(xcode-select -p | sed 's|/Contents/Developer||')
          fi
          echo "Using: $XCODE_PATH"
          sudo xcode-select -s "${XCODE_PATH}/Contents/Developer"
          xcodebuild -version

      - name: Verify repo structure
        run: |
          echo "=== Repo structure ==="
          find "$GITHUB_WORKSPACE" -name "*.xcodeproj" -maxdepth 4
          find "$GITHUB_WORKSPACE" -name "*.swift" -maxdepth 6 | sort
          echo "=== Resources folder ==="
          ls -la "$GITHUB_WORKSPACE/FFExternal/Resources/" 2>/dev/null || echo "No Resources folder yet"

      - name: Resolve project path
        id: paths
        run: |
          PROJ=$(find "$GITHUB_WORKSPACE" -name "FFExternal.xcodeproj" -maxdepth 4 | head -1)
          PROJ_DIR=$(dirname "$PROJ")
          echo "PROJ=$PROJ"         >> $GITHUB_OUTPUT
          echo "PROJ_DIR=$PROJ_DIR" >> $GITHUB_OUTPUT
          echo "Project: $PROJ"

      - name: Validate pbxproj
        run: |
          PBXPROJ="${{ steps.paths.outputs.PROJ_DIR }}/FFExternal.xcodeproj/project.pbxproj"
          for entry in "CheatSettings.swift" "SecurityBind.swift" "AntiDebug.swift" "StringObfuscator.swift" \
                       "DesignSystem.swift" "LanguagePickerView.swift" "LoginView.swift" "MainMenuView.swift"; do
            if grep -q "$entry" "$PBXPROJ"; then
              echo "  ✓ $entry"
            else
              echo "  ✗ MISSING: $entry"
              exit 1
            fi
          done
          echo "All files registered."

      - name: List schemes
        run: |
          cd "${{ steps.paths.outputs.PROJ_DIR }}"
          xcodebuild -project FFExternal.xcodeproj -list 2>&1 || true

      - name: Install SwiftShield
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SSVER=$(curl -sf \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/rockbruno/swiftshield/releases/latest" \
            | grep '"tag_name"' | cut -d'"' -f4)
          if [ -z "$SSVER" ]; then SSVER="3.14.3"; fi
          echo "SwiftShield $SSVER"
          curl -fL "https://github.com/rockbruno/swiftshield/releases/download/${SSVER}/swiftshield.zip" \
            -o /tmp/ss.zip
          unzip -o /tmp/ss.zip -d /tmp/swiftshield
          SS_BIN=$(find /tmp/swiftshield -name "swiftshield" -type f | grep -v dSYM | head -1)
          chmod +x "$SS_BIN"
          echo "$(dirname "$SS_BIN")" >> $GITHUB_PATH

      - name: Obfuscate Swift symbols
        run: |
          cd "${{ steps.paths.outputs.PROJ_DIR }}"
          swiftshield obfuscate \
            --project-root . \
            --scheme FFExternal \
            --output-path "$RUNNER_TEMP/obfuscated" \
            --ignore-files "App.swift,DesignSystem.swift,CheatSettings.swift,AntiDebug.swift" \
            2>&1 | tee /tmp/swiftshield.log || true

          if [ -d "$RUNNER_TEMP/obfuscated" ]; then
            echo "SS_PROJ_DIR=$RUNNER_TEMP/obfuscated" >> $GITHUB_ENV
          else
            echo "SwiftShield fallback — building from source"
            echo "SS_PROJ_DIR=${{ steps.paths.outputs.PROJ_DIR }}" >> $GITHUB_ENV
          fi


      - name: Compile FFCheat.dll
        run: |
          # Install Mono
          brew install mono 2>/dev/null || true
          MCS=$(which mcs 2>/dev/null || echo "")
          if [ -z "$MCS" ]; then
            echo "ERROR: mcs not found after brew install mono"
            exit 1
          fi
          echo "mcs: $MCS"

          # Compile UnityEngine stub first
          STUB_SRC="$GITHUB_WORKSPACE/FFCheat/stubs/UnityEngineStub.cs"
          echo "Stub path: $STUB_SRC"
          ls "$STUB_SRC" 2>/dev/null || { echo "ERROR: stub not found"; find "$GITHUB_WORKSPACE" -name "*.cs" | head -20; exit 1; }
          $MCS "$STUB_SRC" -target:library -out:"$RUNNER_TEMP/UnityEngine.dll"
          echo "UnityEngine stub: $(ls -lh $RUNNER_TEMP/UnityEngine.dll)"

          # Compile our cheat
          CHEAT_SRC="$GITHUB_WORKSPACE/FFCheat"
          $MCS \
            "$CHEAT_SRC/FFCheatConfig.cs" \
            "$CHEAT_SRC/FFCheatESP.cs" \
            "$CHEAT_SRC/FFCheatAim.cs" \
            "$CHEAT_SRC/FFCheatMovement.cs" \
            "$CHEAT_SRC/FFCheatHUD.cs" \
            "$CHEAT_SRC/FFCheatMenu.cs" \
            "$CHEAT_SRC/FFCheatLoader.cs" \
            -r:"$RUNNER_TEMP/UnityEngine.dll" \
            -target:library \
            -optimize+ \
            -out:"$RUNNER_TEMP/FFCheat.dll"

          if [ -f "$RUNNER_TEMP/FFCheat.dll" ]; then
            echo "FFCheat.dll: $(ls -lh $RUNNER_TEMP/FFCheat.dll)"
            echo "FFCHEAT_DLL=$RUNNER_TEMP/FFCheat.dll" >> $GITHUB_ENV
          else
            echo "ERROR: FFCheat.dll not produced"
            exit 1
          fi
      - name: Build (unsigned + hardened + size obfuscated)
        run: |
          set -o pipefail
          BUILD_DIR="${SS_PROJ_DIR:-${{ steps.paths.outputs.PROJ_DIR }}}"
          cd "$BUILD_DIR"

          BUILD_OUT="$RUNNER_TEMP/build_output"

          xcodebuild build \
            -project FFExternal.xcodeproj \
            -scheme FFExternal \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            SDKROOT=iphoneos \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            ENABLE_BITCODE=NO \
            DEBUG_INFORMATION_FORMAT=dwarf-with-dsym \
            SWIFT_COMPILATION_MODE=wholemodule \
            SWIFT_OPTIMIZATION_LEVEL=-Osize \
            GCC_OPTIMIZATION_LEVEL=s \
            ENABLE_TESTABILITY=NO \
            DEAD_CODE_STRIPPING=YES \
            STRIP_INSTALLED_PRODUCT=YES \
            STRIP_STYLE=all \
            COPY_PHASE_STRIP=YES \
            GCC_SYMBOLS_PRIVATE_EXTERN=YES \
            CONFIGURATION_BUILD_DIR="$BUILD_OUT" \
            2>&1 | tee /tmp/xcodebuild.log

          BUILD_EXIT=${PIPESTATUS[0]}
          if [ "$BUILD_EXIT" -ne 0 ]; then
            echo "=== BUILD FAILED — last 400 lines ==="
            tail -400 /tmp/xcodebuild.log
            exit $BUILD_EXIT
          fi

          echo "BUILD_OUT=$BUILD_OUT" >> $GITHUB_ENV

      - name: Show build log on failure
        if: failure()
        run: |
          tail -500 /tmp/xcodebuild.log || true
          cat /tmp/swiftshield.log || true



      - name: Package IPA
        run: |
          BUILD_OUT="${BUILD_OUT:-$RUNNER_TEMP/build_output}"
          APP_PATH=$(find "$BUILD_OUT" -name "FFExternal.app" -maxdepth 4 | head -1)

          if [ -z "$APP_PATH" ]; then
            # fallback: search derived data
            APP_PATH=$(find "$RUNNER_TEMP/DerivedData" -name "FFExternal.app" -not -path "*.dSYM/*" | head -1)
          fi

          echo "App: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: .app not found"
            find "$RUNNER_TEMP" -name "*.app" 2>/dev/null | head -10
            exit 1
          fi

          IPA_STAGING="$RUNNER_TEMP/IPAStaging/Payload"
          mkdir -p "$IPA_STAGING"
          cp -R "$APP_PATH" "$IPA_STAGING/"

          # Resources padding removed - causes Esign timeout on large IPA

          cd "$RUNNER_TEMP/IPAStaging"
          zip -r "$RUNNER_TEMP/FFExternal.ipa" Payload/

          IPA_BYTES=$(wc -c < "$RUNNER_TEMP/FFExternal.ipa")
          echo "IPA size: $(du -sh "$RUNNER_TEMP/FFExternal.ipa" | cut -f1) ($IPA_BYTES bytes)"


      - name: Compile Assembly-CSharp-patch.bytes
        run: |
          set -e
          
          brew install mono 2>/dev/null || true
          MCS=$(which mcs)
          echo "Using mcs: $MCS"
          
          PATCH_SRC="$GITHUB_WORKSPACE/FFPatch"
          IFIX_SRC="$GITHUB_WORKSPACE/InjectFix/Source/VSProj"
          UNITY_STUB="$GITHUB_WORKSPACE/FFCheat/stubs/UnityEngineStub.cs"
          
          # Build UnityEngine stub
          $MCS "$UNITY_STUB" -target:library -out:"$RUNNER_TEMP/UnityEngine.dll"
          echo "UnityEngine stub: $(ls -lh $RUNNER_TEMP/UnityEngine.dll)"
          
          # Compile game stubs (COW.*) + IFix stubs into reference DLL
          $MCS \
            "$PATCH_SRC/COWStub.cs" \
            "$PATCH_SRC/IFixStub.cs" \
            -r:"$RUNNER_TEMP/UnityEngine.dll" \
            -target:library -unsafe \
            -out:"$RUNNER_TEMP/GameStubs.dll"
          echo "GameStubs.dll: $(ls -lh $RUNNER_TEMP/GameStubs.dll)"
          
          # Compile FFEX patch files against stubs
          $MCS \
            "$PATCH_SRC/FFEXConfig.cs" \
            "$PATCH_SRC/FFEXIFixConfig.cs" \
            "$PATCH_SRC/FFEXBootstrap.cs" \
            "$PATCH_SRC/FFEXPatch.cs" \
            "$PATCH_SRC/FFEXAimbot.cs" \
            "$PATCH_SRC/FFEXEsp.cs" \
            "$PATCH_SRC/FFEXMenu.cs" \
            -r:"$RUNNER_TEMP/UnityEngine.dll","$RUNNER_TEMP/GameStubs.dll" \
            -target:library -unsafe \
            -out:"$RUNNER_TEMP/FFEXPatch.dll"
          echo "FFEXPatch.dll: $(ls -lh $RUNNER_TEMP/FFEXPatch.dll)"
          
          # Build IFix tools from InjectFix source
          cd "$IFIX_SRC"
          $MCS Src/Builder/*.cs Src/Version.cs Src/Core/*.cs \
            -define:UNITY_IPHONE -unsafe -target:library \
            -out:"$RUNNER_TEMP/IFix.Core.dll"
          
          $MCS Src/Tools/*.cs Src/Version.cs \
            -define:UNITY_IPHONE -unsafe \
            -reference:ThirdParty/Mono.Cecil.dll,ThirdParty/Mono.Cecil.Mdb.dll,ThirdParty/Mono.Cecil.Pdb.dll,"$RUNNER_TEMP/IFix.Core.dll" \
            -out:"$RUNNER_TEMP/IFix.exe"
          echo "IFix.exe: $(ls -lh $RUNNER_TEMP/IFix.exe)"
          
          # Generate patch.bytes
          cd "$RUNNER_TEMP"
          mono IFix.exe fix "$RUNNER_TEMP/GameStubs.dll" FFEXPatch.dll \
            -out:Assembly-CSharp-patch.bytes 2>&1 || true
          
          if [ -f "$RUNNER_TEMP/Assembly-CSharp-patch.bytes" ]; then
            echo "✓ patch.bytes: $(ls -lh $RUNNER_TEMP/Assembly-CSharp-patch.bytes)"
            echo "PATCH_BYTES=$RUNNER_TEMP/Assembly-CSharp-patch.bytes" >> $GITHUB_ENV
          else
            echo "IFix output not found, using FFEXPatch.dll directly"
            cp FFEXPatch.dll Assembly-CSharp-patch.bytes
            echo "PATCH_BYTES=$RUNNER_TEMP/Assembly-CSharp-patch.bytes" >> $GITHUB_ENV
          fi

      - name: Package cheat files
        run: |
          mkdir -p "$RUNNER_TEMP/cheat_files"
          # FFCheat.dll - our compiled cheat
          if [ -f "$FFCHEAT_DLL" ]; then
            cp "$FFCHEAT_DLL" "$RUNNER_TEMP/cheat_files/FFCheat.dll"
          fi
          # localConfig.json template
          echo '{"aimbot":false,"aimSilent":false,"fovCircle":false,"speedHack":false,"bulletSpeed":false,"fps144":false,"streamproof":false,"espBox":false,"espLine":false,"espHealth":false,"espName":false,"espDistance":false,"espSkeleton":false,"enemyCounter":false,"fovRadius":100,"aimbotStrength":60,"aimbotTarget":0,"enemyDistance":150,"speedMultiplier":5,"bulletMultiplier":10}' > "$RUNNER_TEMP/cheat_files/localConfig.json"
          # Copy patch.bytes
          if [ -f "$PATCH_BYTES" ]; then
            cp "$PATCH_BYTES" "$RUNNER_TEMP/cheat_files/Assembly-CSharp-patch.bytes"
            echo "patch.bytes: $(ls -lh $RUNNER_TEMP/cheat_files/Assembly-CSharp-patch.bytes)"
          fi
          echo "Cheat files:"
          ls -la "$RUNNER_TEMP/cheat_files/"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: FFExternal-${{ github.run_number }}
          path: ${{ runner.temp }}/FFExternal.ipa
          retention-days: 30
          if-no-files-found: error

      - name: Upload Cheat Files
        uses: actions/upload-artifact@v4
        with:
          name: CheatFiles-${{ github.run_number }}
          path: ${{ runner.temp }}/cheat_files/
          retention-days: 30
          if-no-files-found: warn
